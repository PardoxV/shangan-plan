<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上岸计划 · 求职者</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#101828; --muted:#667085; --line:#E4E7EC;
  --blue:#2563EB; --blue-50:#EFF4FF; --blue-700:#1D4ED8;
  --green:#059669; --green-50:#ECFDF5; --amber:#D97706; --amber-50:#FFFAEB;
  --red:#DC2626; --red-50:#FEF2F2; --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}
/* ===== 左侧栏 ===== */
.side{width:264px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:24px 20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:17px;font-weight:700;letter-spacing:.2px}
.brand-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.stat-card{background:var(--blue-50);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.stat-num{font-size:26px;font-weight:800;color:var(--blue);line-height:1.1}
.stat-label{font-size:12px;color:var(--blue-700);opacity:.75;margin-top:2px}
.f-head{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.4px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink);transition:all .15s;user-select:none}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:16px}
.search-box svg{flex-shrink:0}
.search-box input{border:none;outline:none;font-size:13.5px;width:100%;background:transparent;color:var(--ink)}
.side-note{font-size:11.5px;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--line);line-height:1.7}
/* ===== 左侧常驻工作台看板（参考豆包工作台形式，桌面端常驻左侧） ===== */
.sidepanel{width:320px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sp-head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.sp-brand{display:flex;align-items:center;gap:10px}
.sp-brand .brand-mark{width:32px;height:32px;border-radius:9px}
.sp-title{font-size:15px;font-weight:800;letter-spacing:.2px}
.sp-sub{font-size:11px;color:var(--muted);margin-top:1px}
.sp-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:12px;background:#F8FAFC}
.sp-search svg{flex-shrink:0}
.sp-search input{border:none;outline:none;font-size:13px;width:100%;background:transparent;color:var(--ink)}
.sp-search input:focus{color:var(--ink)}
.sp-search .kbd{margin-left:auto;font-size:10px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex-shrink:0}
.sp-nav{padding:10px 12px;border-bottom:1px solid var(--line)}
.sp-nav .sp-nav-t{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.6px;padding:4px 8px 8px}
.sp-nav .entries{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sp-entry{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer;background:transparent;color:var(--ink);font-size:12.5px;font-weight:600;transition:all .15s;text-align:left}
.sp-entry:hover{background:var(--blue-50)}
.sp-entry.on{background:var(--blue-50);border-color:#BFDBFE;color:var(--blue-700)}
.sp-entry .eico{width:26px;height:26px;border-radius:8px;background:#EFF4FF;color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-entry .eico svg{width:15px;height:15px}
.sp-view{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sp-view .sp-v-title{font-size:14px;font-weight:800}
.sp-view .sp-v-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.sp-section{background:#F8FAFC;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sp-sec-h{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#fff;font-size:12px;font-weight:700;border-bottom:1px solid var(--line)}
.sp-sec-h .cnt{font-size:11px;color:var(--muted);font-weight:600}
.sp-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;min-width:0}
.sp-item:last-child{border-bottom:none}
.sp-item:hover{background:#fff}
.sp-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sp-item .it-t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sp-item .it-m{font-size:10.5px;color:var(--muted);flex-shrink:0;margin-left:6px}
.sp-item.open{opacity:.55}
.sp-item .badge{font-size:10px;font-weight:700;padding:1.5px 6px;border-radius:5px;flex-shrink:0}
.badge.un{background:var(--blue-50);color:var(--blue-700)}
.badge.ap{background:var(--green-50);color:var(--green)}
.badge.closed{background:#F2F4F7;color:var(--muted)}
.sp-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp-kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.sp-kpi .k-num{font-size:21px;font-weight:800;line-height:1.1}
.sp-kpi .k-num.blue{color:var(--blue)}.sp-kpi .k-num.green{color:var(--green)}.sp-kpi .k-num.amber{color:var(--amber)}.sp-kpi .k-num.red{color:var(--red)}
.sp-kpi .k-lab{font-size:11px;color:var(--muted);margin-top:3px}
.sp-srcbar{display:flex;flex-direction:column;gap:7px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}
.sp-srcbar .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.sp-srcbar .row b{color:var(--ink);font-weight:700}
.sp-srcbar .bar{flex:1;height:6px;background:#F2F4F7;border-radius:3px;overflow:hidden}
.sp-srcbar .bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.sp-resume{font-size:12px;color:var(--ink);line-height:1.8}
.sp-resume .rv-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:8px}
.sp-resume .rv-card .rv-t{font-size:12px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.sp-resume .rv-line{font-size:11.5px;color:var(--muted)}
.sp-resume .rv-tag{display:inline-block;font-size:10.5px;background:var(--blue-50);color:var(--blue-700);border-radius:6px;padding:2px 7px;margin:3px 4px 0 0}
.sp-resume .rv-btn{display:block;text-align:center;padding:10px;border-radius:9px;background:var(--blue);color:#fff;font-size:12.5px;font-weight:700;margin-top:10px}
.sp-resume .rv-btn:hover{background:var(--blue-700)}
.sp-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
.sp-foot .who{display:flex;align-items:center;gap:8px}
.sp-foot .who .avatar{width:26px;height:26px;font-size:12px;border-radius:8px}
.sp-foot a{color:var(--blue-700);font-weight:600}
.sp-foot a:hover{text-decoration:underline}
/* ===== 主区筛选折叠条 ===== */
.filterbar{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.filterbar .f-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filterbar .f-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;margin-right:2px}
.filterbar .chip{padding:4px 10px;font-size:12px}
.filterbar .chip.on{padding:4px 10px}
/* ===== 规则中心 ===== */
.rules-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);margin-top:16px;transition:all .15s}
.rules-btn:hover{border-color:var(--blue);color:var(--blue)}
.rules-btn .ico{width:20px;height:20px;border-radius:6px;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.rules-mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
.rules-mask.show{opacity:1;pointer-events:auto}
.rules-drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;background:#fff;z-index:70;box-shadow:-12px 0 32px rgba(16,24,40,.16);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.rules-drawer.show{transform:translateX(0)}
.rd-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.rd-head h2{font-size:16px;font-weight:800}
.rd-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.rd-close:hover{color:var(--ink);border-color:#C7D7FE}
.rd-body{flex:1;overflow-y:auto;padding:16px 20px 20px}
.rd-sec{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rd-sec-h{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#F8FAFC;font-size:13px;font-weight:700;border-bottom:1px solid var(--line)}
.rd-sec-h .ver{font-size:11px;color:var(--muted);font-weight:500}
.rd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13px;border-bottom:1px solid #F2F4F7}
.rd-row:last-child{border-bottom:none}
.rd-row .k{color:var(--ink);font-weight:600}
.rd-row .v{color:var(--muted);text-align:right;font-size:12.5px}
.rd-row .v.good{color:var(--green);font-weight:700}
.rd-row .v.warn{color:var(--amber);font-weight:700}
.rd-row .v.bad{color:var(--red);font-weight:700}
.rd-toggle{position:relative;width:40px;height:22px;border-radius:999px;background:#E4E7EC;cursor:pointer;transition:background .15s;flex-shrink:0}
.rd-toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.2);transition:transform .15s}
.rd-toggle.on{background:var(--green)}
.rd-toggle.on::after{transform:translateX(18px)}
.rd-num{width:64px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;text-align:center;outline:none;background:#fff;color:var(--ink)}
.rd-num:focus{border-color:var(--blue)}
.rd-txt{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;outline:none;background:#fff;color:var(--ink);max-width:70%}
.rd-txt:focus{border-color:var(--blue)}
.rd-sel{border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;background:#fff;color:var(--ink);outline:none}
.rd-del{width:26px;height:26px;border:none;border-radius:8px;background:#FEF2F2;color:#EF4444;font-size:15px;line-height:1;cursor:pointer;flex-shrink:0}
.rd-del:hover{background:#FEE2E2}
.rd-dir-edit{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px dashed #F2F4F7}
.rd-dir-edit:last-child{border-bottom:none}
.rd-dir-add{display:inline-flex;align-items:center;gap:6px;margin:10px 14px;padding:7px 14px;border:1px dashed var(--line);border-radius:10px;background:#fff;color:var(--blue-700);font-size:12.5px;font-weight:600;cursor:pointer}
.rd-dir-add:hover{border-color:var(--blue);background:var(--blue-50)}
.rd-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fff}
.rd-btn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.rd-btn.primary{background:var(--blue);color:#fff}
.rd-btn.primary:hover{background:var(--blue-700)}
.rd-btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
.rd-btn.ghost:hover{color:var(--ink);border-color:#C7D7FE}
.rd-saved{text-align:center;font-size:12px;color:var(--green);padding:6px 0 0;min-height:20px}
.rd-preview{margin:10px 14px 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.rd-preview .pv-head{font-weight:700;font-size:13px;margin-bottom:8px}
.rd-preview .pv-sec{margin:6px 0;border-top:1px dashed var(--line);padding-top:6px}
.rd-preview .pv-sec-t{font-size:11px;color:var(--muted);margin-bottom:4px}
.rd-preview .pv-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0;color:var(--fg)}
.rd-preview .pv-row.ok{color:var(--green)}
.rd-preview .pv-row.bad{color:var(--red)}
.rd-preview .pv-row.muted{color:var(--muted)}
.rd-preview .pv-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.rd-preview .pv-actions .rd-btn{width:auto;flex:1}
.rd-note{font-size:11.5px;color:var(--muted);line-height:1.7;background:var(--blue-50);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.rd-dir{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:12.5px;border-bottom:1px dashed #F2F4F7}
.rd-dir:last-child{border-bottom:none}
.rd-dir .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.rd-dir .tag.high{background:var(--green-50);color:var(--green)}
.rd-dir .tag.medium{background:var(--amber-50);color:var(--amber)}
.rd-dir .tag.low{background:#F2F4F7;color:var(--muted)}
.rd-chip{display:inline-block;font-size:11.5px;color:var(--muted);background:#F8FAFC;border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin:3px 4px 0 0}
.rd-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin:2px 4px 0 0}
.rd-badge.learn{background:var(--amber-50);color:var(--amber)}
.rd-hint{font-size:12px;color:var(--blue-700);background:var(--blue-50);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.6}
/* ===== 右侧主区 ===== */
.main{flex:1;padding:24px 28px 48px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top-title h1{font-size:22px;font-weight:800;letter-spacing:.2px}
.top-title p{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{padding:7px 16px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);border:none;background:transparent}
.tab.on{background:var(--blue);color:#fff}
.tab .cnt{font-weight:700;margin-left:2px;opacity:.85}
.sort-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.sort-bar select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;background:#fff;color:var(--ink);outline:none}
.sort-bar .result{margin-left:auto;font-size:12.5px;color:var(--muted)}
/* ===== 卡片流 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.job{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s;position:relative}
.job:hover{box-shadow:0 6px 18px rgba(16,24,40,.08);border-color:#C7D7FE}
.job.applied{background:#FCFCFD;border-color:var(--line);opacity:.82}
.job-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.job-corp{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.job-title{font-size:15.5px;font-weight:700;line-height:1.35;word-break:break-all}
.job-company{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{flex-shrink:0;text-align:right}
.score-num{font-size:24px;font-weight:800;line-height:1;color:var(--blue)}
.score-label{font-size:10.5px;color:var(--muted);margin-top:2px}
.score-bar{width:52px;height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.score-bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.job-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3.5px 10px;border-radius:999px;font-weight:600}
.pill.salary{background:var(--ink);color:#fff}
.pill.worktime{background:var(--green-50);color:var(--green);border:1px solid #A7F3D0}
.pill.worktime.none{background:#F2F4F7;color:var(--muted);border:1px solid var(--line)}
.pill.src{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:500}
.pill.cm{font-weight:700}
.pill.cm.good{background:var(--green-50);color:var(--green)}
.pill.cm.mid{background:var(--amber-50);color:var(--amber)}
.pill.cm.far{background:var(--red-50);color:var(--red)}
.pill.cm.online{background:var(--blue-50);color:var(--blue-700)}
.job-note{font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.job-foot{display:flex;align-items:center;gap:10px;margin-top:auto}
.group-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:8px 0 2px;font-size:14.5px;font-weight:800;color:var(--ink);padding:8px 12px;background:var(--green-50);border-radius:10px;border:1px solid #A7F3D0}
.group-h .cnt{font-size:12px;color:var(--green);font-weight:700}
.apply-btn{flex:1;text-align:center;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:700;background:var(--blue);color:#fff;border:none;cursor:pointer;transition:background .15s}
.apply-btn:hover{background:var(--blue-700)}
.apply-btn.done{background:#F2F4F7;color:var(--muted);cursor:default;font-weight:600}
.mark-btn{flex:1;text-align:center;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:600;background:#fff;color:var(--green);border:1px solid #A7F3D0;cursor:pointer;transition:background .15s,border-color .15s}
.mark-btn:hover{background:var(--green-50);border-color:var(--green)}
.tag-mini{font-size:11px;font-weight:700;padding:2.5px 8px;border-radius:6px}
.tag-mini.reco{background:var(--blue-50);color:var(--blue-700)}
.tag-mini.prio{background:var(--amber-50);color:var(--amber)}
.tag-mini.check{background:#F2F4F7;color:var(--muted)}
.tag-mini.selfcheck{background:#FEF3C7;color:#92400E;}

/* ===== 工具 ===== */
var PALETTE=["#2563EB","#0E7490","#6D28D9","#0F766E","#C2410C","#4F46E5"];
function hashColor(name){var h=0;for(var i=0;i<name.length;i++){h=(h*31+name.charCodeAt(i))>>>0}return PALETTE[h%PALETTE.length]}
function salNum(s){var m=s.match(/([\d.]+)-([\d.]+)K/);return m?+m[2]:0}
function cmClass(cm){if(cm===0)return"online";if(cm<=15)return"good";if(cm<=20)return"mid";return"far"}
function cmText(cm){return cm===0?"线上":("骑行"+cm+"分")}
var STATE={tab:"un",src:"all",score:0,cm:99,kw:"",sort:"score",ruleOnly:false};
/* ===== 规则判定引擎（override 生效） ===== */
function parseSalaryMin(s){
  if(!s)return null;
  var m;
  if((m=s.match(/([\d.]+)\s*[-~～]\s*([\d.]+)\s*K/i)))return Math.min(+m[1],+m[2])*1000;
  if((m=s.match(/([\d.]+)\s*[-~～]\s*([\d.]+)\s*千/)))return Math.min(+m[1],+m[2])*1000;
  if((m=s.match(/([\d.]+)\s*千\s*[-~～]\s*([\d.]+)\s*万/)))return +m[1]*1000;
  if((m=s.match(/([\d.]+)\s*[-~～]\s*([\d.]+)\s*万\/年/)))return Math.min(+m[1],+m[2])*10000/12;
  if((m=s.match(/([\d.]+)\s*万\/年/)))return +m[1]*10000/12;
  if((m=s.match(/([\d.]+)\s*[-~～]\s*([\d.]+)\s*万/)))return Math.min(+m[1],+m[2])*10000/12;
  if((m=s.match(/([\d.]+)\s*K/i)))return +m[1]*1000;
  if((m=s.match(/([\d.]+)\s*千/)))return +m[1]*1000;
  return null;
}
function hitList(name,list){
  name=(name||"").toLowerCase();
  return (list||[]).some(function(x){return x&&name.indexOf(x.toLowerCase())>-1});
}
function jobRuleFlags(j){
  var o=RULES.override||{},b=RULES.blk||{},flags=[];
  if(!o.enabled)return flags;
  var min=parseSalaryMin(j.s);
  if(min!=null){
    if(min<o.salary_min_take_home)flags.push("薪资低于"+o.salary_min_take_home+"底线");
    if(o.salary_max_push&&min>o.salary_max_push)flags.push("薪资超上限");
  }
  if(j.cm>0&&j.cm>o.bike_max_min){
    var tt=(j.l||"")+(j.note||"");
    var tm=tt.match(/公交\s*([\d.]+)\s*分/);
    if(!(tm&&+tm[1]<=o.transit_max_min))flags.push("骑行超"+o.bike_max_min+"分");
  }
  if(o.block_outsource&&hitList(j.c,b.outsource))flags.push("外包公司");
  if(o.block_company_blacklist&&hitList(j.c,b.company))flags.push("公司黑名单");
  if(hitList(j.t,b.roles))flags.push("排除角色");
  return flags;
}
/* ===== 渲染 ===== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function filtered(){
  return JOBS.filter(function(j){
    if(STATE.tab==="un"&&j.ap)return false;if(STATE.tab==="un"&&j.note&&j.note.indexOf("已关闭")>-1)return false;
    if(STATE.tab==="applied"&&!j.ap)return false;
    if(STATE.src!=="all"&&j.src!==STATE.src)return false;
    if(j.sc<STATE.score)return false;
    if(STATE.cm<99&&(j.cm>STATE.cm||j.cm===0))return false;
    if(STATE.kw&&!(j.t+j.c).toLowerCase().indexOf(STATE.kw.toLowerCase())>-1)return false;
    if(STATE.ruleOnly&&jobRuleFlags(j).length)return false;
    return true;
  }).sort(function(a,b){
    if(STATE.sort==="cm")return a.cm-b.cm;
    if(STATE.sort==="sal")return salNum(b.s)-salNum(a.s);
    return b.sc-a.sc;
  });
}
function cardHtml(j){
  var cml=cmClass(j.cm),cmt=cmText(j.cm);
  var tag=j.st==="推荐"?'<span class="tag-mini reco">推荐</span>':j.st==="优先"?'<span class="tag-mini prio">优先</span>':j.st==="自查"?'<span class="tag-mini selfcheck">自查</span>':'<span class="tag-mini check">待核</span>';
  var wtCls=j.wt==="双休"?"":" none";
  var fl=jobRuleFlags(j);
  var flHtml=fl.length?'<div style="margin-top:4px">'+fl.map(function(f){return'<span class="tag-mini" style="background:var(--red-50);color:var(--red);font-size:10.5px">⚠ '+esc(f)+'</span>'}).join("")+'</div>':'';
  return '<article class="job'+(j.ap?' applied':'')+'" data-u="'+j.u+'">'+
    '<div class="job-head"><div class="job-corp">'+
      '<div class="avatar" style="background:'+hashColor(j.c)+'">'+esc(j.c[0])+'</div>'+
      '<div><div class="job-title">'+tag+' '+esc(j.t)+'</div><div class="job-company">'+esc(j.c)+'</div></div>'+
    '</div>'+
    '<div class="score"><div class="score-num">'+j.sc+'</div><div class="score-label">综合分</div>'+
    '<div class="score-bar"><i style="width:'+j.sc+'%"></i></div></div></div>'+
    '<div class="job-meta">'+
      '<span class="pill salary">'+esc(j.s)+'</span>'+
      '<span class="pill cm '+cml+'">'+cmt+'</span>'+
      '<span class="pill worktime'+wtCls+'">'+(j.wt==="双休"?"周末双休":"作息未注明")+'</span>'+
      '<span class="pill src">'+esc(j.src)+'</span>'+
    '</div>'+flHtml+
    '<div class="job-note">'+esc(j.l)+' ｜ '+esc(j.note)+'</div>'+
    '<div class="job-foot">'+
      (j.note&&j.note.indexOf("已关闭")>-1?'<div class="apply-btn done" style="background:#999">已关闭</div>':
        '<a class="apply-btn" href="'+j.u+'" target="_blank" rel="noopener">投递</a>'+
        '<select class="st-sel card" data-r="'+esc(j.r)+'" data-old="'+esc(j.ps||"未投")+'" title="更新投递状态到岗位库（自动写回多维表格并归纳卡片）">'+
          ['未投','已投','已回复','面试','婉拒','入职'].map(function(s){return '<option value="'+s+'"'+((j.ps||"未投")===s?' selected':'')+'>'+s+'</option>'}).join('')+
        '</select>')+
    '</div></article>';
}
function render(){
  var list=filtered();
  var grid=document.getElementById("grid");
  if(!list.length){
    grid.innerHTML='<div class="empty"><div class="big">0</div>没有符合条件的岗位<br>试试放宽筛选条件</div>';
  }else if(STATE.tab==="applied"){
    /* 已投界面：按投递状态细分归纳（未投不在此列） */
    var GROUPS=['已投','已回复','面试','婉拒','入职'];
    var html="";
    GROUPS.forEach(function(g){
      var items=list.filter(function(j){return (j.ps||"已投")===g});
      if(!items.length)return;
      html+='<div class="group-h"><b>'+g+'</b><span class="cnt">'+items.length+' 条</span></div>'+items.map(cardHtml).join("");
    });
    grid.innerHTML=html||'<div class="empty"><div class="big">0</div>没有符合条件的岗位<br>试试放宽筛选条件</div>';
  }else{
    grid.innerHTML=list.map(cardHtml).join("");
  }
  /* 规则统计：达标 vs 违反 */
  var o=RULES.override||{};
  var passAll=JOBS.filter(function(j){return jobRuleFlags(j).length===0}).length;
  var failAll=JOBS.length-passAll;
  var ruleTxt=o.enabled?("规则达标 "+passAll+" / 违反 "+failAll):"规则过滤已关闭";
  document.getElementById("resultText").textContent=list.length+" 个岗位 · "+ruleTxt;
  document.getElementById("cntUn").textContent=JOBS.filter(function(j){return !j.ap&&!(j.note&&j.note.indexOf("已关闭")>-1)}).length;
  document.getElementById("cntAp").textContent=JOBS.filter(function(j){return j.ap}).length;
  document.getElementById("cntAll").textContent=JOBS.length;
}
/* ===== 事件 ===== */
function bindChips(id,key,onMap){
  document.getElementById(id).addEventListener("click",function(e){
    var b=e.target.closest(".chip");if(!b)return;
    Array.prototype.forEach.call(this.children,function(c){c.classList.remove("on")});
    b.classList.add("on");
    STATE[key]=onMap?onMap(b.dataset.v):b.dataset.v;
    if(key==="tab"){Array.prototype.forEach.call(document.getElementById("tabsWrap").children,function(t){t.classList.remove("on")})}
    render();
  });
}
bindChips("chipSrc","src");
bindChips("chipScore","score",function(v){return +v});
bindChips("chipCm","cm",function(v){return +v});
bindChips("chipState","tab",function(v){return v});
document.getElementById("tabsWrap").addEventListener("click",function(e){
  var t=e.target.closest(".tab");if(!t)return;
  Array.prototype.forEach.call(this.children,function(x){x.classList.remove("on")});
  t.classList.add("on");STATE.tab=t.dataset.t;
  Array.prototype.forEach.call(document.getElementById("chipState").children,function(c){c.classList.remove("on")});
  document.getElementById("chipState").children[0].classList.add("on");
  render();
});
var kwTimer;
document.getElementById("kw").addEventListener("input",function(){
  clearTimeout(kwTimer);
  kwTimer=setTimeout(function(){STATE.kw=document.getElementById("kw").value.trim();render()},200);
});
document.getElementById("sortSel").addEventListener("change",function(){STATE.sort=this.value;render()});
/* ===== 右侧工作台面板（豆包工作台式） ===== */
function spToast(msg,ok){
  var t=document.getElementById("toast");
  t.innerHTML=ok?("<b>✓</b> "+esc(msg)):esc(msg);
  t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show")},4200);
}
function isClosed(j){
  return !!(j.note&&j.note.indexOf("已关闭")>-1);
}
function trackGroups(){
  var un=[],ap=[],closed=[];
  JOBS.forEach(function(j){if(isClosed(j))closed.push(j);else if(j.ap)ap.push(j);else un.push(j)});
  return {un:un,ap:ap,closed:closed};
}

  var ST_SEL=['已投','已回复','面试','婉拒','入职'];

        ST_SEL.map(function(s){return '<option value="'+s+'"'+(j.ps===s?' selected':'')+'>'+s+'</option>'}).join('')+

      var fbSel=badge==="ap"?('<select class="fb-sel" data-r="'+esc(j.r)+'" data-ps="'+esc(j.ps||"已投")+'" data-old="'+esc(j.fb||"待定")+'" title="更新投递反馈到多维表格">'+

      return '<div class="v-item" data-u="'+esc(j.u)+'"><span class="dot" style="background:'+dot+'"></span>'+

/* 本地规则引擎：从岗位标题/备注提取要求关键词，返回 [{kw, weight}] */
function extractJobKeywords(job){
  var txt=[job.t||"",job.note||"",job.c||""].join(" ");
  var banks=[
    {cat:"AI内容创作",kw:["AIGC","AI视频","AI创作","漫剧","影视","剪辑","短视频","视频制作","内容创作","提示词","Prompt","图像生成","数字人","编导","特效"]},
    {cat:"数据标注/评测",kw:["标注","评测","训练","精标","Caption","数据","质检","审核","评估","模型"]},
    {cat:"运营/产品",kw:["运营","产品","用户","增长","活动","内容运营","社群"]},
    {cat:"教培/教研",kw:["讲师","教师","数学","教研","教学","教务","助教","授课","辅导"]},
    {cat:"行政/政企",kw:["行政","助理","编外","编制","事业单位","国企","档案","会务","文员","公文"]},
    {cat:"通勤/待遇",kw:["双休","周末双休","朝九晚六","五险一金","13薪","通勤"]},
    {cat:"经验要求",kw:["经验不限","零基础","无经验","1-3年","3-5年","本科","大专","应届"]}
  ];
  var out=[];
  banks.forEach(function(b){
    var hits=b.kw.filter(function(k){return txt.indexOf(k)>-1});
    if(hits.length)out.push({cat:b.cat,kw:hits});
  });
  return out;
}
/* 命中画像：岗位关键词 → 我的可呈现经历 */
function matchResumeSkills(job){
  var txt=[job.t||"",job.note||"",job.c||""].join(" ");
  var hits=RESUME_PROFILE.skills.map(function(s){
    var matched=s.kw.filter(function(k){return txt.indexOf(k)>-1});
    return {label:s.label,matched:matched,hit:matched.length>0};
  }).filter(function(s){return s.hit});
  return hits;
}
/* 风险点：岗位要求与我相悖的硬性条件 */
function riskCheck(job){
  var txt=[job.t||"",job.note||""].join(" ");
  var risks=[];
  if(/1-3年|3-5年|5-10年/.test(txt))risks.push("注明需多年经验，应届可投性低——投前先电话/沟通确认是否接受应届培养");
  if(/CET|英语四级|英语六级|英语4级/.test(txt))risks.push("英语证书硬门槛（你无 CET 证书），若为硬性则不建议投");
  if(/销售|客服|主播|电销/.test(txt)&&RULES.override.exclude_roles_keywords&&RULES.override.exclude_roles_keywords.length)risks.push("命中你的排除角色关键词（销售/客服/主播），默认不推");
  if(job.ps==="婉拒")risks.push("此岗位你已婉拒过，系统默认不再重复推进");
  if(job.note&&job.note.indexOf("已关闭")>-1)risks.push("岗位已关闭，仅保留记录");
  return risks;
}
/* 生成定制动作（可执行的简历调整清单） */
function tailorActions(job,hits){
  var acts=[];
  var txt=[job.t||"",job.note||""].join(" ");
  if(/标注|评测|训练|Caption|数据/.test(txt))acts.push("把「AI 工具深度应用 + 大模型协作经验」提到技能第一条，并量化：搭建自动化求职工作流，日处理多来源岗位并沉淀 100+ 条岗位库");
  if(/AIGC|AI视频|漫剧|剪辑|创作|视频制作/.test(txt))acts.push("把「AIGC 创作（AI视频/漫剧作品集）」置顶，附作品集链接，用『自建 AI 求职系统实战』证明执行力");
  if(/数学|讲师|教学|教研|辅导|授课/.test(txt))acts.push("突出「高中数学线上 1对1 讲师」：拆解知识点与解题思路，能独立备课、控场、答疑");
  if(/行政|助理|编外|档案|文员|会务/.test(txt))acts.push("突出「办公软件熟练 + 行政事务经历」：教案/台账/学员档案整理，细致有条理");
  if(/运营|产品/.test(txt))acts.push("把 AI 工具应用包装为「内容/产品运营辅助」：用 AI 批量产出内容、搭建自动化流程，提质增效");
  if(/感统|儿童|特教|训练/.test(txt))acts.push("突出「儿童感统训练 7 个月」：评估学员情况、制定个性化训练计划，家长反馈佳");
  if(!acts.length)acts.push("无强关键词命中，建议：按岗位主线人工选择 1-2 个最相关经历置顶，其余精简为一行");
  if(acts.length>3)acts=acts.slice(0,3);
  return acts;
}

var APPLY_STATES=['未投','已投','已回复','面试','婉拒','入职'];
document.addEventListener("change",function(e){
  var sel=e.target;
  if(!sel.classList)return;
  var isSt=sel.classList.contains("st-sel"),isFb=sel.classList.contains("fb-sel");
  if(!isSt&&!isFb)return;
  var rid=sel.getAttribute("data-r"),old=sel.getAttribute("data-old")||"";
  var state=isSt?sel.value:(sel.getAttribute("data-ps")||"已投");
  var fb=isFb?sel.value:"";
  var changed=(isSt&&sel.value!==old)||(isFb&&fb!==old);
  if(!changed){return}
  /* 乐观更新：先改本地单一事实源并立即渲染归纳，再异步写多维表格 */
  for(var i=0;i<JOBS.length;i++){if(JOBS[i].r===rid){
    if(isSt){JOBS[i].ps=state;JOBS[i].ap=(state!=="未投")?1:0}
    if(isFb)JOBS[i].fb=fb;
    break}}
  render();renderTrack();renderStats();renderResume();renderRoad();
  var toast=document.getElementById("toast");
  toast.innerHTML="本地已更新：<b>"+esc(isFb?fb:state)+"</b>，正在同步多维表格…";
  toast.classList.add("show");
  clearTimeout(toast._t);
  var body={record_id:rid,state:state};
  if(isFb){body.feedback=fb}
  wbPost("/api/status",JSON.stringify(body))
    .then(function(res){return res.json()})
    .then(function(d){
      if(d.ok){
        toast.innerHTML="已同步：<b>"+esc(isFb?fb:state)+"</b>（多维表格已更新）";
      }else{
        toast.innerHTML="本地已归纳，多维表格同步失败："+esc(d.error||d.msg||"未知错误")+"（可稍后重试或到豆包补录）";
      }
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t=setTimeout(function(){toast.classList.remove("show")},4200);
    })
    .catch(function(err){
      toast.innerHTML="本地已归纳，多维表格同步失败："+esc(err.message)+"（可稍后重试或到豆包补录）";
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t=setTimeout(function(){toast.classList.remove("show")},4200);
    });
});

  h.push(tglRow("block_company_blacklist","公司黑名单拦截",o.block_company_blacklist));
  h.push(listInput("company_blacklist_companies","公司黑名单",o.company_blacklist_companies&&o.company_blacklist_companies.length?o.company_blacklist_companies:(s.company_blacklist_companies||[]),"公司名（逗号分隔）"));
  h.push('</div>');
  /* 生效统计 + 仅看达标 */
  var passN=JOBS.filter(function(j){return jobRuleFlags(j).length===0}).length;
  h.push('<div class="rd-sec"><div class="rd-sec-h">规则生效统计<span class="ver">岗位库 '+JOBS.length+' 条</span></div>');
  h.push('<div class="rd-row"><span class="k">当前规则达标</span><span class="v good">'+passN+' 个</span></div>');
  h.push('<div class="rd-row"><span class="k">违反当前规则</span><span class="v '+(JOBS.length-passN?'bad':'good')+'">'+(JOBS.length-passN)+' 个</span></div>');
  h.push(tglRow("rule_only","列表仅显示达标岗",STATE.ruleOnly));
  h.push('</div>');
  if(s.skill_gate||o.skill_gate_user_lacks||o.skill_gate_block_keywords||o.skill_gate_override_pass_keywords){
    h.push('<div class="rd-sec"><div class="rd-sec-h">技能门槛<span class="ver">不推</span></div>');
    h.push(listInput("skill_gate_user_lacks","用户不具备",o.skill_gate_user_lacks&&o.skill_gate_user_lacks.length?o.skill_gate_user_lacks:(s.skill_gate&&s.skill_gate.user_lacks||[]),"技能（逗号分隔）"));
    h.push(listInput("skill_gate_block_keywords","硬性不推关键词",o.skill_gate_block_keywords&&o.skill_gate_block_keywords.length?o.skill_gate_block_keywords:(s.skill_gate&&s.skill_gate.block_keywords||[]),"关键词（逗号分隔）"));
    h.push(listInput("skill_gate_override_pass_keywords","豁免词",o.skill_gate_override_pass_keywords&&o.skill_gate_override_pass_keywords.length?o.skill_gate_override_pass_keywords:(s.skill_gate&&s.skill_gate.override_pass_keywords||[]),"命中豁免词可放行"));
    h.push('</div>');
  }
  if(s.learned_exclusion&&s.learned_exclusion.length){
    h.push('<div class="rd-sec"><div class="rd-sec-h">反馈学习 · 已排除方向<span class="ver">婉拒累计≥2次</span></div><div style="padding:10px 14px">');
    s.learned_exclusion.forEach(function(r){h.push('<div class="rd-row" style="padding:6px 0"><span class="k" style="font-size:12px">'+esc(r.pattern)+'</span><span class="rd-badge learn">婉拒×'+esc(r.reject_count)+'</span></div>')});
    h.push('</div></div>');
  }
  h.push('<div class="rd-note">说明：所有字段均为可编辑；保存后立即写入 override 文件，刷新页面仍保留；权威 rules.json（每日推送使用的规则）保持不变。规则大众化＝把这份 override 做成可导出模板（见页面底部「导出模板 / 导入模板」，导出 JSON 发给对方即可用，模板已剥离姓名/住址等隐私）。</div>');
  document.getElementById("rulesBody").innerHTML=h.join("");
  document.querySelectorAll(".rd-toggle").forEach(function(t){t.addEventListener("click",function(){
    var on=t.classList.toggle("on");t.setAttribute("aria-checked",String(on));
    var k=t.getAttribute("data-toggle");
    if(k==="no_rotation")RULES.override.no_rotation=on;
    if(k==="legal_holidays_off")RULES.override.legal_holidays_off=on;
    if(k==="block_outsource")RULES.override.block_outsource=on;
    if(k==="block_company_blacklist")RULES.override.block_company_blacklist=on;
    if(k==="rule_only"){STATE.ruleOnly=on;render();}
    RULES.dirty=true;showSaved("已修改，点击「保存规则」生效");
  })});
  document.querySelectorAll(".rd-num").forEach(function(n){n.addEventListener("input",function(){
    var k=n.getAttribute("data-k"),v=parseInt(n.value,10);
    if(!isNaN(v)){if(k==="骑行上限（分钟）")RULES.override.bike_max_min=v;
      else if(k==="公交/地铁上限（分钟）")RULES.override.transit_max_min=v;
      else if(k==="到手底线（元）")RULES.override.salary_min_take_home=v;
      else if(k==="最高推送薪资（元）")RULES.override.salary_max_push=v;
      RULES.dirty=true;showSaved("已修改，点击「保存规则」生效");}
  })});
  /* 可编辑文本：input 事件实时写 override，逗号分隔拆成数组 */
  document.querySelectorAll(".rd-txt[data-f]").forEach(function(n){n.addEventListener("input",function(){
    var f=n.getAttribute("data-f"),v=n.value.trim();
    var listFields={commute_must_measure_with:1,salary_pre_tax_rule:1};
    if(listFields[f])RULES.override[f]=v;
    else RULES.override[f]=v.split(/[，,;；\n]+/).map(function(x){return x.trim()}).filter(Boolean);
    RULES.dirty=true;showSaved("已修改，点击「保存规则」生效");
  })});
  /* 求职方向：名称/优先级/删除/添加 */
  document.querySelectorAll(".dir-name").forEach(function(n){n.addEventListener("input",function(){
    var i=+n.getAttribute("data-i");
    var dirs=(RULES.override.directions&&RULES.override.directions.length)?RULES.override.directions:(RULES.summary.directions||[]);
    if(!dirs[i])return;dirs[i].name=n.value;RULES.override.directions=dirs;
    RULES.dirty=true;showSaved("已修改，点击「保存规则」生效");
  })});
  document.querySelectorAll(".dir-prio").forEach(function(sl){sl.addEventListener("change",function(){
    var i=+sl.getAttribute("data-i");
    var dirs=(RULES.override.directions&&RULES.override.directions.length)?RULES.override.directions:(RULES.summary.directions||[]);
    if(!dirs[i])return;dirs[i].priority=sl.value;RULES.override.directions=dirs;
    RULES.dirty=true;showSaved("已修改，点击「保存规则」生效");
  })});
  document.querySelectorAll(".rd-del").forEach(function(b){b.addEventListener("click",function(){
    var i=+b.getAttribute("data-i");
    var dirs=(RULES.override.directions&&RULES.override.directions.length)?RULES.override.directions:(RULES.summary.directions||[]).map(function(d){return{name:d.name,priority:d.priority}});
    dirs.splice(i,1);RULES.override.directions=dirs;
    RULES.dirty=true;renderRules();render();showSaved("已删除方向，点击「保存规则」生效");
  })});
  var add=document.getElementById("addDir");
  if(add)add.addEventListener("click",function(){
    var dirs=(RULES.override.directions&&RULES.override.directions.length)?RULES.override.directions:(RULES.summary.directions||[]).map(function(d){return{name:d.name,priority:d.priority}});
    dirs.push({name:"",priority:"medium"});RULES.override.directions=dirs;
    RULES.dirty=true;renderRules();render();showSaved("已添加方向行，点击「保存规则」生效");
  });
}
function showSaved(txt){
  var el=document.getElementById("rulesSaved");el.textContent=txt;
  clearTimeout(showSaved._t);showSaved._t=setTimeout(function(){el.textContent=""},2600);
}
/* 规则中心已改为主区页面视图，打开/关闭由 showMainView 处理 */
document.getElementById("rulesReset").addEventListener("click",function(){
  if(!confirm("恢复默认规则？当前 override 将被覆盖。"))return;
  RULES.override={bike_max_min:30,transit_max_min:60,salary_min_take_home:5000,salary_max_push:15000,weekend_rest_min_days:1,block_outsource:false,block_company_blacklist:false,enabled:true};
  renderRules();RULES.dirty=true;render();showSaved("已恢复默认，点击「保存规则」生效");
});
/* 导出规则模板：GET /api/rules/export -> 下载 JSON 文件 */
document.getElementById("rulesExport").addEventListener("click",function(){
  fetch("/api/rules/export").then(function(res){return res.json()}).then(function(d){
    if(!d.ok){showSaved("导出失败："+(d.error||"未知错误"));return}
    var blob=new Blob([JSON.stringify(d.template,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="上岸计划-规则模板-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(a.href);
    showSaved("已导出规则模板 JSON ✓ 可分享给他人导入");
  }).catch(function(err){showSaved("导出失败："+err.message+"（本地服务未启动？）")});
});
/* 导入规则模板：读文件 -> POST /api/rules/import -> 刷新 */
document.getElementById("rulesImport").addEventListener("click",function(){
  document.getElementById("rulesFile").click();
});
document.getElementById("rulesFile").addEventListener("change",function(){
  var f=this.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var data;
    try{data=JSON.parse(rd.result)}catch(e){showSaved("导入失败：文件不是合法 JSON");this.value="";return}
    if(!data||typeof data!=="object"){showSaved("导入失败：模板结构无效");this.value="";return}
    var src=(data.override&&typeof data.override==="object")?data.override:data;
    var allowed={bike_max_min:1,transit_max_min:1,salary_min_take_home:1,salary_max_push:1,weekend_rest_min_days:1,block_outsource:1,block_company_blacklist:1,enabled:1};
    var tpl={};Object.keys(allowed).forEach(function(k){if(src[k]!==undefined&&src[k]!==null)tpl[k]=src[k]});
    if(!Object.keys(tpl).length){showSaved("导入失败：模板里没有可识别的规则字段");this.value="";return}
    /* 预览：对比当前 override 与模板 override 的岗位达标变化 */
    var cur=RULES.override||{};
    var changes=[];
    var names={bike_max_min:"骑行上限",transit_max_min:"公交/地铁上限",salary_min_take_home:"到手底线",salary_max_push:"最高推送",weekend_rest_min_days:"每周休息天数",block_outsource:"外包拦截",block_company_blacklist:"公司黑名单拦截",enabled:"规则生效开关"};
    Object.keys(tpl).forEach(function(k){
      var a=cur[k],b=tpl[k];
      if(String(a)!==String(b))changes.push('<div class="pv-row"><span>'+names[k]+'</span><span>'+fmtV(a)+' → <b>'+fmtV(b)+'</b></span></div>');
    });
    var curPass=0,curFail=0,tplPass=0,tplFail=0,newPass=[],newFail=[];
    JOBS.forEach(function(j){
      var fCur=jobRuleFlagsWith(j,cur).length,fTpl=jobRuleFlagsWith(j,tpl).length;
      if(fCur===0)curPass++;else curFail++;
      if(fTpl===0)tplPass++;else tplFail++;
      if(fCur>0&&fTpl===0)newPass.push(j);
      if(fCur===0&&fTpl>0)newFail.push(j);
    });
    var pv=document.getElementById("rulesPreview");
    pv.style.display="block";
    pv.innerHTML='<div class="pv-head">导入预览 · '+esc(data.name||"未命名模板")+'</div>'+
      '<div class="pv-sec"><div class="pv-sec-t">将修改的参数（'+changes.length+' 项）</div>'+
      (changes.length?changes.join(""):'<div class="pv-row muted">与当前规则一致，无数字变化</div>')+'</div>'+
      '<div class="pv-sec"><div class="pv-sec-t">对岗位库的影响（共 '+JOBS.length+' 条）</div>'+
      '<div class="pv-row"><span>当前规则达标</span><span>'+curPass+' / 违反 '+curFail+'</span></div>'+
      '<div class="pv-row"><span>导入后达标</span><span>'+tplPass+' / 违反 '+tplFail+'</span></div>'+
      (newPass.length?'<div class="pv-row ok">将新增达标 '+newPass.length+' 条</div>':'')+
      (newFail.length?'<div class="pv-row bad">将变为违反 '+newFail.length+' 条</div>':'')+
      '</div>'+
      '<div class="pv-actions"><button class="rd-btn ghost" id="pvCancel">取消</button><button class="rd-btn primary" id="pvApply">确认应用</button></div>';
    RULES._pendingTpl=tpl;RULES._pendingName=data.name||"未命名模板";
    document.getElementById("pvCancel").addEventListener("click",function(){pv.style.display="none";RULES._pendingTpl=null});
    document.getElementById("pvApply").addEventListener("click",function(){
      applyImportedTemplate(RULES._pendingTpl);
      pv.style.display="none";RULES._pendingTpl=null;
    });
    this.value="";
  };
  rd.readAsText(f);
  this.value="";
});
function fmtV(v){if(v===true)return"开";if(v===false)return"关";return v}
function jobRuleFlagsWith(j,ov){
  var b=RULES.blk||{},flags=[];
  if(!ov.enabled)return flags;
  var min=parseSalaryMin(j.s);
  if(min!=null){
    if(min<ov.salary_min_take_home)flags.push("x");
    if(ov.salary_max_push&&min>ov.salary_max_push)flags.push("x");
  }
  if(j.cm>0&&j.cm>ov.bike_max_min){
    var tt=(j.l||"")+(j.note||"");
    var tm=tt.match(/公交\s*([\d.]+)\s*分/);
    if(!(tm&&+tm[1]<=ov.transit_max_min))flags.push("x");
  }
  if(ov.block_outsource&&hitList(j.c,b.outsource))flags.push("x");
  if(ov.block_company_blacklist&&hitList(j.c,b.company))flags.push("x");
  if(hitList(j.t,b.roles))flags.push("x");
  return flags;
}
function applyImportedTemplate(tpl){
  wbPost("/api/rules/import",JSON.stringify({template:{override:tpl}}))
    .then(function(res){return res.json()})
    .then(function(d){
      if(d.ok){
        RULES.override=d.saved;RULES.summary=d.summary;
        RULES.blk={outsource:d.summary.outsource_companies||[],company:d.summary.company_blacklist_companies||[],roles:d.summary.exclude_roles_keywords||[]};
        renderRules();render();
        showSaved("导入成功：已应用模板字段 ["+d.imported.join(", ")+"] ✓ 点「保存规则」固化");
        RULES.dirty=true;
      }
      else showSaved("导入失败："+(d.error||"未知错误"));
    }).catch(function(err){showSaved("导入失败："+err.message+"（本地服务未启动？）")});
}
document.getElementById("rulesSave").addEventListener("click",function(){
  var btn=this;btn.disabled=true;btn.textContent="保存中…";
  wbPost("/api/rules",JSON.stringify(RULES.override))
    .then(function(res){return res.json()})
    .then(function(d){
      btn.disabled=false;btn.textContent="保存规则";
      if(d.ok){RULES.override=d.saved;RULES.summary=d.summary;RULES.dirty=false;showSaved("已保存到 workbench_rules.json ✓");renderRules();render();}
      else showSaved("保存失败："+(d.error||"未知错误"));
    })
    .catch(function(err){btn.disabled=false;btn.textContent="保存规则";showSaved("保存失败："+err.message+"（本地服务未启动？）")});
});
/* ---- 本地写操作令牌（防外部页面伪造请求；token 由同源 /api/token 下发，跨源被 CORS 拦截） ---- */
var WB_TOK="";
function wbHeaders(withJson){
  var h={};
  if(WB_TOK)h["X-Workbench-Token"]=WB_TOK;
  if(withJson)h["Content-Type"]="application/json";
  return h;
}
function wbPost(url,body){
  return fetch(url,{method:"POST",headers:wbHeaders(true),body:body});
}
if(/^https?:$/.test(location.protocol)){
  fetch("/api/token").then(function(r){return r.json()}).then(function(d){if(d.ok)WB_TOK=d.token})
    .catch(function(){});
}
function seedOverrideFromSummary(o,s){
  /* 首次加载：把权威 rules.json 的可编辑列表回填进 override，作为可编辑初始值 */
  if(!o.directions||!o.directions.length)o.directions=(s.directions||[]).map(function(d){return{name:d.name,priority:d.priority}});
  if(!o.commute_must_measure_with)o.commute_must_measure_with=(s.commute&&s.commute.must_measure_with)||"";
  if(!o.salary_pre_tax_rule)o.salary_pre_tax_rule=(s.salary&&s.salary.rule)||"";
  if(!o.work_schedule_exclude||!o.work_schedule_exclude.length)o.work_schedule_exclude=(s.work_schedule&&s.work_schedule.exclude)||[];
  if(!o.exclude_roles_keywords||!o.exclude_roles_keywords.length)o.exclude_roles_keywords=s.exclude_roles_keywords||[];
  if(!o.outsource_companies||!o.outsource_companies.length)o.outsource_companies=s.outsource_companies||[];
  if(!o.company_blacklist_companies||!o.company_blacklist_companies.length)o.company_blacklist_companies=s.company_blacklist_companies||[];
  if(!o.skill_gate_user_lacks||!o.skill_gate_user_lacks.length)o.skill_gate_user_lacks=(s.skill_gate&&s.skill_gate.user_lacks)||[];
  if(!o.skill_gate_block_keywords||!o.skill_gate_block_keywords.length)o.skill_gate_block_keywords=(s.skill_gate&&s.skill_gate.block_keywords)||[];
  if(!o.skill_gate_override_pass_keywords||!o.skill_gate_override_pass_keywords.length)o.skill_gate_override_pass_keywords=(s.skill_gate&&s.skill_gate.override_pass_keywords)||[];
  return o;
}
function loadRules(){
  if(!/^https?:$/.test(location.protocol)){
    document.getElementById("rulesHint").textContent="请通过 http://localhost:8123 打开工作台（file:// 下无法读取规则）";
    return;
  }
  fetch("/api/rules").then(function(res){return res.json()}).then(function(d){
    if(d.ok){
      RULES.override=d.override||{};
      RULES.summary=d.summary||{};
      seedOverrideFromSummary(RULES.override,RULES.summary);
      RULES.blk={
        outsource:RULES.override.outsource_companies&&RULES.override.outsource_companies.length?RULES.override.outsource_companies:(d.summary.outsource_companies||[]),
        company:RULES.override.company_blacklist_companies&&RULES.override.company_blacklist_companies.length?RULES.override.company_blacklist_companies:(d.summary.company_blacklist_companies||[]),
        roles:RULES.override.exclude_roles_keywords&&RULES.override.exclude_roles_keywords.length?RULES.override.exclude_roles_keywords:(d.summary.exclude_roles_keywords||[])
      };
      document.getElementById("rulesHint").style.display="none";
      renderRules();render();
    }
    else {document.getElementById("rulesHint").textContent="加载失败："+(d.error||"未知错误");}
  }).catch(function(err){document.getElementById("rulesHint").textContent="加载失败："+err.message+"（本地服务未启动？）"});
}
/* 页面启动即加载规则（用于渲染违规标记与统计） */
loadRules();
render();
showMainView("jobs");
/* 全局委托：v-item 岗位条目点击 → 打开岗位原始页（排除 select/a/button 等交互元素的误触） */
document.addEventListener("click",function(e){
  var it=e.target.closest(".v-item");
  if(!it)return;
  if(e.target.closest("select,a,button,input,label"))return;
  var u=it.getAttribute("data-u");
  if(u&&u.indexOf("http")===0){window.open(u,"_blank");}
});
